[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "case-lab"
version = "1.0.0"
description = "Управляемый кейс: заявка на поставку от письма до черновика заказа"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
case-lab = "case_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case_lab = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
